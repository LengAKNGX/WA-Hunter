name: Bug report
description: Report a reproducible problem in WA Hunter itself
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the command, expected result, and actual result.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.12, g++ 13
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and personal paths before posting.
      render: shell
