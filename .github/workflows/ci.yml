name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile wa_hunter.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Differential test the correct example
        run: python wa_hunter.py
